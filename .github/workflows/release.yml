name: Release

# Push a semver tag (e.g. `v3.1.4`): once the full CI passes, this builds the
# package and opens a DRAFT release carrying it, unsigned. Drafts are invisible
# to the public and to the update site.
#
# The draft is published by the CaeloWorks signing run, which CI cannot do (it has
# neither PixInsight nor the keys): download the zip and update-package.json,
# scripts/sign-package.sh on them, upload both back over the draft's, publish.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # The whole of CI, not a subset. Publishing used to be independent of it: the
  # tag workflow re-ran the harness and the package check but skipped the
  # sidecar validator - the guard on the HTML entities that would make the
  # shared repository index malformed and take every CaeloWorks script down with
  # it - along with shellcheck, the SPDX check and the licence check.
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: The tag must be documented
        run: |
          # A release whose changes are not written down is a release nobody can
          # tell apart from the one before it.
          v="${{ steps.v.outputs.version }}"
          grep -q "^## \[$v\]" CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no [$v] section"; exit 1; }

      - name: Build the distribution artifact
        run: bash scripts/build-update-package.sh "${{ steps.v.outputs.version }}"

      - name: Contents match the update site's ingest contract
        # Unsigned at this point; sign-package.sh checks it again, --signed.
        run: bash scripts/check-package.sh dist/*.zip

      - name: Open the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --verify-tag \
            --title "Foraxx Palette Studio $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*.zip \
            dist/update-package.json

      - name: Say what is left to do
        run: |
          v="${{ steps.v.outputs.version }}"
          {
            echo "### Draft opened for $GITHUB_REF_NAME, unsigned"
            echo
            echo "Nothing is public yet. To sign and publish, from a machine with PixInsight and the keys:"
            echo
            echo '```'
            echo "gh release download $GITHUB_REF_NAME -R $GITHUB_REPOSITORY -D dist"
            echo "XSSK_PATH=/path/to/caeloworks.xssk scripts/sign-package.sh dist/ForaxxPaletteStudio-$v.zip"
            echo "gh release upload $GITHUB_REF_NAME -R $GITHUB_REPOSITORY --clobber dist/ForaxxPaletteStudio-$v.zip dist/update-package.json"
            echo "gh release edit $GITHUB_REF_NAME -R $GITHUB_REPOSITORY --draft=false"
            echo '```'
            echo
            echo "Then run the signed hand gate in \`docs/RELEASING.md\`, and give the site the"
            echo "sha1 from the signed update-package.json: a signed zip is not reproducible."
          } >> "$GITHUB_STEP_SUMMARY"
